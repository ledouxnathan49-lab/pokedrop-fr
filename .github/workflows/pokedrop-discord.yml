name: PokéDrop Discord

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer une alerte Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run:
  curl -X POST \
    -H "Content-Type: application/json" \
    -d "{\"content\":\"🎁 PokéDrop détecté ! $(date -u +"%H:%M UTC")\"}" \
    "$WEBHOOK"