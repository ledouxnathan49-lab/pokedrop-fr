<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokéDrop FR</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
background:linear-gradient(180deg,#041028,#09173A);
color:white;
}
.wrap{
max-width:430px;
margin:auto;
padding:24px;
min-height:100vh;
}
.hero{
text-align:center;
padding:42px 0;
animation:fade .6s ease;
}
@keyframes fade{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:none}
}
.logo{font-size:60px;margin-bottom:12px}
h1{font-size:46px;font-weight:800}
.sub{opacity:.8;font-size:21px;margin-top:8px}

.live{
display:inline-flex;
align-items:center;
gap:8px;
padding:8px 14px;
border-radius:999px;
margin-top:18px;
background:#133a25;
color:#32ff88;
font-weight:700;
}
.live::before{
content:"";
width:8px;
height:8px;
border-radius:50%;
background:#32ff88;
animation:pulse 1.2s infinite;
}
@keyframes pulse{
50%{transform:scale(1.6)}
}

.card{
background:#101d42;
padding:20px;
border-radius:22px;
margin:18px 0;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.tile{
background:#15264f;
border-radius:18px;
padding:22px;
text-align:center;
transition:.2s;
cursor:pointer;
}

.tile:active{
transform:scale(.97);
}

.tile .emoji{
font-size:32px;
margin-bottom:8px;
}

button{
width:100%;
padding:18px;
margin-top:22px;
border:none;
border-radius:18px;
background:linear-gradient(90deg,#5865F2,#6D5EF7);
color:white;
font-size:20px;
font-weight:700;
}

.version{
text-align:center;
opacity:.6;
margin-top:22px;
}

.modal{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:#0009;
padding:22px;
}

.box{
background:#101d42;
padding:22px;
border-radius:22px;
width:100%;
max-width:360px;
}

.close{
margin-top:18px;
background:#22396b;
}
</style>
</head>

<body>

<div class="wrap">

<div class="hero">
<div class="logo">🎮</div>
<h1>PokéDrop FR</h1>
<div class="sub">Alertes Pokémon France</div>

<div class="live">LIVE</div>
</div>

<div class="card">
<h2>🔔 Alertes Leclerc</h2>
<p>Stock en temps réel • Version V2</p>
</div>

<div class="grid">

<div class="tile" onclick="openCard('etb')">
<div class="emoji">📦</div>
ETB 30 ans
</div>

<div class="tile" onclick="openCard('upc')">
<div class="emoji">🎁</div>
UPC Premium
</div>

<div class="tile" onclick="openCard('mag')">
<div class="emoji">📍</div>
Magasins
</div>

<div class="tile" onclick="openCard('cote')">
<div class="emoji">📈</div>
Cotes
</div>

</div>

<button onclick="window.open('https://discord.gg','_blank')">
Rejoindre le Discord
</button>

<div class="version">
Version 2.0 • GitHub Pages 🚀
</div>

</div>

<div class="modal" id="modal">
<div class="box">
<h2 id="titre"></h2>
<p id="texte" style="margin-top:12px;opacity:.85;white-space:pre-line"></p>
<button class="close" onclick="closeCard()">Fermer</button>
</div>
</div>

<script>

const infos={
etb:["📦 ETB 30 ans","Prix Leclerc : 55€\nRevente estimée : 70 à 100€."],
upc:["🎁 UPC Ultra Premium","Prix conseillé : 119€\nObjectif de revente : 180 à 300€."],
mag:["📍 Magasins","Angers Camus\nAngers Centre\nBouchemaine\nFrance bientôt."],
cote:["📈 Cotes","Suivi des cartes Mew, Pikachu et UPC bientôt."]
};

function openCard(id){
document.getElementById("titre").innerText=infos[id][0];
document.getElementById("texte").innerText=infos[id][1];
document.getElementById("modal").style.display="flex";
}

function closeCard(){
document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>
